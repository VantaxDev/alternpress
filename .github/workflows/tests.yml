name: PHP and HTTP security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install PHP runtime extensions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mbstring php-gd php-curl brotli
      - name: Check PHP syntax
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php -l alt-cli
      - name: Run isolated regression and security checks
        run: |
          for test in tests/*.php; do php "$test"; done
          python3 tests/security-http.py
          python3 tests/discovery-http.py
          python3 tests/page-cache-http.py
          python3 tests/password-cli.py
          python3 tests/publication-http.py
